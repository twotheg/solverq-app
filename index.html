<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>풀이Q</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B6FD9">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="풀이Q">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

  :root{
    --bg:#F5F8FC;
    --surface:#FFFFFF;
    --ink:#21324B;
    --ink-soft:#5B6B85;
    --primary:#3B6FD9;
    --primary-dark:#2450B0;
    --primary-soft:#E4ECFB;
    --accent:#FF6B6B;
    --accent-soft:#FFE9E9;
    --success:#1FA398;
    --success-soft:#DEF7F4;
    --warn:#FFB627;
    --warn-soft:#FFF4DE;
    --border:#E1E8F2;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 10px 28px rgba(33,50,75,0.10);
    --font-display:'Jua','Apple SD Gothic Neo',sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-body);color:var(--ink);}
  body{display:flex;justify-content:center;min-height:100vh;padding:20px 12px;}

  .app-frame{
    width:100%;max-width:430px;background:var(--surface);
    border-radius:32px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-height:780px;overflow:hidden;
    position:relative;border:1px solid var(--border);
  }

  .topbar{
    padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .topbar .title{font-family:var(--font-display);font-size:20px;color:var(--primary-dark);}
  .icon-btn{
    width:36px;height:36px;border-radius:12px;border:none;background:var(--primary-soft);
    color:var(--primary-dark);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;font-weight:700;
  }
  .icon-btn:hover{background:#d5e2f9;}
  .progress-dots{display:flex;gap:6px;align-items:center;}
  .progress-dots span{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .progress-dots span.active{background:var(--primary);width:18px;border-radius:5px;transition:.2s;}

  .content{flex:1;overflow-y:auto;padding:4px 20px 20px;}
  .content::-webkit-scrollbar{width:0;}

  .bottomnav{
    display:flex;border-top:1px solid var(--border);padding:10px 8px 14px;flex-shrink:0;background:var(--surface);
  }
  .nav-btn{
    flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-family:var(--font-body);font-size:11.5px;cursor:pointer;padding:6px 0;border-radius:12px;
  }
  .nav-btn .nav-ic{font-size:19px;}
  .nav-btn.active{color:var(--primary);font-weight:700;background:var(--primary-soft);}

  h1.hero{font-family:var(--font-display);font-size:26px;line-height:1.35;color:var(--ink);margin:6px 0 4px;}
  p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;line-height:1.5;}

  .mascot{display:block;margin:6px auto 10px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  .grade-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .chip{
    padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
    font-size:13px;color:var(--ink-soft);cursor:pointer;font-weight:600;
  }
  .chip.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);}

  .subject-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;}
  .subject-card{
    display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--radius-lg);
    border:2px solid var(--border);cursor:pointer;background:var(--surface);transition:.15s;
  }
  .subject-card:hover{border-color:var(--primary);}
  .subject-card .emoji{font-size:30px;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .subject-card.math .emoji{background:var(--primary-soft);}
  .subject-card.english .emoji{background:var(--accent-soft);}
  .subject-card .txt strong{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink);margin-bottom:2px;}
  .subject-card .txt span{font-size:12.5px;color:var(--ink-soft);}

  .btn{
    width:100%;padding:15px;border-radius:16px;border:none;font-family:var(--font-display);
    font-size:16px;cursor:pointer;text-align:center;letter-spacing:.2px;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(59,111,217,.28);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#B9C7E4;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:var(--primary-soft);color:var(--primary-dark);}
  .btn-outline{background:#fff;color:var(--ink-soft);border:1.5px solid var(--border);}
  .btn-warn{background:var(--accent);color:#fff;}
  .btn-row{display:flex;gap:10px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  .dropzone{
    display:flex;flex-direction:column;align-items:center;
    border:2px dashed var(--primary);background:var(--primary-soft);border-radius:var(--radius-lg);
    padding:36px 18px;text-align:center;cursor:pointer;margin-bottom:16px;
  }
  .dropzone .big-emoji{font-size:38px;margin-bottom:8px;}
  .dropzone strong{display:block;font-family:var(--font-display);color:var(--primary-dark);font-size:16px;margin-bottom:4px;}
  .dropzone span{font-size:12.5px;color:var(--ink-soft);}

  .dropzone-row{display:flex;gap:10px;margin-bottom:16px;}
  .dropzone-half{flex:1;padding:22px 10px;margin-bottom:0;}
  .dropzone-half .big-emoji{font-size:28px;margin-bottom:6px;}
  .dropzone-half strong{font-size:13.5px;}
  .dropzone-half span{font-size:11px;}

  .crop-stage{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#111;margin-bottom:14px;touch-action:none;}
  .crop-stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .crop-rect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,0.5);cursor:move;}
  .crop-handle{position:absolute;width:22px;height:22px;background:#fff;border:2px solid var(--primary);border-radius:50%;touch-action:none;}
  .crop-handle.nw{left:-11px;top:-11px;cursor:nwse-resize;}
  .crop-handle.ne{right:-11px;top:-11px;cursor:nesw-resize;}
  .crop-handle.sw{left:-11px;bottom:-11px;cursor:nesw-resize;}
  .crop-handle.se{right:-11px;bottom:-11px;cursor:nwse-resize;}
  .crop-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;
    font-size:11.5px;padding:5px 12px;border-radius:999px;pointer-events:none;text-align:center;max-width:88%;}

  .preview-wrap{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);margin-bottom:16px;}
  .preview-wrap img{width:100%;display:block;max-height:280px;object-fit:contain;background:#F0F3F8;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;}
  .card.soft{background:var(--primary-soft);border:none;}
  .card-label{font-size:11.5px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  textarea.recog{
    width:100%;min-height:110px;border:none;background:transparent;resize:vertical;
    font-family:var(--font-body);font-size:14.5px;line-height:1.6;color:var(--ink);outline:none;
  }

  .concept-box{background:var(--warn-soft);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
  .concept-box .ic{font-size:18px;}
  .concept-box p{margin:0;font-size:13.5px;line-height:1.55;color:#7A5B00;}

  .step-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px;margin-bottom:12px;
  }
  .step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .step-num{
    width:26px;height:26px;border-radius:9px;background:var(--primary);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;
  }
  .step-title{font-weight:700;font-size:14.5px;color:var(--ink);}
  .step-body{font-size:14px;line-height:1.65;color:var(--ink-soft);padding-left:36px;}

  .answer-box{background:var(--success-soft);border-radius:var(--radius-md);padding:14px 16px;margin:14px 0;}
  .answer-box .lbl{font-size:11.5px;font-weight:700;color:var(--success);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .answer-box .val{font-size:15px;font-weight:700;color:#0E7A6F;}

  .problem-text{font-size:15px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}

  input.answer-input{
    width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);
    font-size:15px;font-family:var(--font-body);outline:none;margin-bottom:12px;
  }
  input.answer-input:focus{border-color:var(--primary);}

  .feedback{border-radius:var(--radius-md);padding:16px;margin-bottom:14px;}
  .feedback.correct{background:var(--success-soft);}
  .feedback.wrong{background:var(--accent-soft);}
  .feedback .ft-title{font-family:var(--font-display);font-size:16px;margin-bottom:4px;}
  .feedback.correct .ft-title{color:#0E7A6F;}
  .feedback.wrong .ft-title{color:#C23A3A;}
  .feedback .ft-body{font-size:13.5px;line-height:1.55;color:var(--ink-soft);}

  .mistake-item{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;
  }
  .mistake-item .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .mistake-item .mtype{font-weight:700;font-size:14px;color:var(--ink);}
  .mistake-item .mcount{font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;font-weight:700;}
  .mistake-item .msnippet{font-size:12.5px;color:var(--ink-soft);}

  .empty-state{text-align:center;padding:60px 20px;}
  .empty-state .big-emoji{font-size:44px;margin-bottom:10px;}
  .empty-state strong{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink);margin-bottom:4px;}
  .empty-state span{font-size:13px;color:var(--ink-soft);}

  .settings-block{margin-bottom:22px;}
  .settings-block h3{font-size:13px;font-weight:700;color:var(--ink-soft);margin:0 0 10px;text-transform:uppercase;letter-spacing:.4px;}
  select.model-select{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);
    font-size:14.5px;font-family:var(--font-body);color:var(--ink);background:#fff;outline:none;
  }
  .model-note{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5;background:var(--bg);padding:10px 12px;border-radius:10px;}

  .loading-overlay{
    position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:20;border-radius:32px;padding:20px;text-align:center;
  }
  .spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:spin 0.8s linear infinite;margin-bottom:14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay p{font-family:var(--font-display);color:var(--primary-dark);font-size:15px;}

  .error-box{background:var(--accent-soft);border-radius:var(--radius-md);padding:16px;margin-bottom:14px;}
  .error-box strong{display:block;color:#C23A3A;font-size:14px;margin-bottom:4px;}
  .error-box span{font-size:12.5px;color:#8a3d3d;}

  .key-warning{background:var(--warn-soft);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .key-warning span{font-size:12.5px;color:#7A5B00;line-height:1.5;}
  .key-warning button{flex-shrink:0;background:var(--warn);color:#fff;border:none;border-radius:10px;
    padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-body);}

  .menu-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .menu-item{
    display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:var(--radius-md);
    border:1.5px solid var(--border);background:var(--surface);cursor:pointer;
  }
  .menu-item:hover{border-color:var(--primary);}
  .menu-ic{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px;}
  .menu-txt{flex:1;min-width:0;}
  .menu-txt strong{display:block;font-family:var(--font-display);font-size:14.5px;color:var(--ink);margin-bottom:2px;}
  .menu-txt span{font-size:12px;color:var(--ink-soft);}
  .menu-chevron{color:var(--ink-soft);font-size:20px;flex-shrink:0;}

  .ref-unit{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px;}
  .ref-unit h4{margin:0 0 10px;font-family:var(--font-display);font-size:14.5px;color:var(--primary-dark);}
  .ref-row{padding:9px 0;border-top:1px dashed var(--border);}
  .ref-row:first-of-type{border-top:none;padding-top:0;}
  .ref-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .ref-eq{font-size:13.5px;color:var(--primary-dark);background:var(--primary-soft);display:inline-block;
    padding:4px 10px;border-radius:8px;font-family:'Courier New',monospace;}
  .ref-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .ref-example{font-size:12.5px;color:var(--ink-soft);margin-top:5px;font-style:italic;}

  .passage-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:14px;}
  .passage-card h4{margin:0 0 10px;font-family:var(--font-display);font-size:15px;color:var(--ink);}
  .passage-text{font-size:14.5px;line-height:2;color:var(--ink);}
  .word-tap{cursor:pointer;border-radius:4px;padding:0 1px;}
  .word-tap:hover, .word-tap:active{background:var(--primary-soft);}
  .word-popup{background:var(--success-soft);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .word-popup .wp-txt strong{display:block;font-family:var(--font-display);color:#0E7A6F;font-size:15px;margin-bottom:2px;}
  .word-popup .wp-txt span{font-size:13px;color:var(--ink-soft);}
  .word-popup button{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;flex-shrink:0;}

  .talk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .talk-card .tk-txt strong{display:block;font-size:14.5px;color:var(--ink);margin-bottom:3px;}
  .talk-card .tk-txt span{font-size:12.5px;color:var(--ink-soft);}
  .talk-speak{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--primary-soft);
    border:none;color:var(--primary-dark);font-size:16px;cursor:pointer;}

  @media (prefers-reduced-motion:reduce){
    .mascot{animation:none;} .spinner{animation:none;}
  }
</style>
</head>
<body>
<div class="app-frame" id="appFrame">
  <div id="root"></div>
</div>

<script>
/* ---------------- state ---------------- */
const state = {
  screen: 'home',
  subject: null,          // 'math' | 'english'
  grade: 'mid',           // 'elem' | 'mid' | 'high'
  difficulty: 'normal',   // 'normal' | 'easy'
  modelPref: 'flash',
  apiKey: '',
  proxyUrl: '',
  imageData: null,        // {base64, mediaType, previewUrl}
  cropRect: { x: 5, y: 5, w: 90, h: 90 }, // percentage of displayed image
  flowType: 'solve',      // 'solve' | 'reading' - what the capture/crop screens are being used for
  readingPassage: null,   // {title, text} recognized from a photographed passage
  wordLookupLoading: false,
  recognized: null,       // {subject, problem_text, problem_type}
  solution: null,         // {concept_summary, steps:[], final_answer}
  similar: null,          // {problem, answer, hint}
  userAnswer: '',
  answerResult: null,     // 'correct' | 'wrong' | null
  mistakes: [],
  expandedMistake: null,
  grammarTopicId: null,   // selected grammar topic for detail drill-down
  wordPopup: null,        // {word, meaning}
  loading: false,
  loadingMsg: '',
  error: null,
};

const GRADE_LABEL = { elem: '초등 고학년', mid: '중학생', high: '고등학생' };
const SUBJECT_LABEL = { math: '수학', english: '영어' };
const MODEL_LABEL = {
  flash: 'Gemini Flash (빠르고 무료 티어, 기본 추천)',
  pro: 'Gemini Pro (더 정교하고 자세한 설명)',
};

/* ---------------- static reference content (2026 교육과정 기준, 대표 단원 발췌) ---------------- */
/* ---------------- simple original SVG diagrams for formula reference ---------------- */
const SVG_RECT = `<svg viewBox="0 0 140 100" width="100%" height="90"><rect x="30" y="15" width="80" height="55" fill="#E4ECFB" stroke="#3B6FD9" stroke-width="2"/><line x1="30" y1="80" x2="110" y2="80" stroke="#5B6B85" stroke-width="1.5"/><text x="70" y="93" font-size="10" fill="#5B6B85" text-anchor="middle">가로</text><line x1="15" y1="15" x2="15" y2="70" stroke="#5B6B85" stroke-width="1.5"/><text x="10" y="45" font-size="10" fill="#5B6B85" text-anchor="middle" transform="rotate(-90 10,45)">세로</text></svg>`;
const SVG_TRIANGLE = `<svg viewBox="0 0 140 100" width="100%" height="90"><polygon points="20,80 120,80 70,15" fill="#E4ECFB" stroke="#3B6FD9" stroke-width="2"/><line x1="70" y1="15" x2="70" y2="80" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4,3"/><text x="76" y="50" font-size="10" fill="#FF6B6B">높이</text><text x="70" y="93" font-size="10" fill="#5B6B85" text-anchor="middle">밑변</text></svg>`;
const SVG_PARALLELOGRAM = `<svg viewBox="0 0 140 100" width="100%" height="90"><polygon points="35,80 115,80 95,15 15,15" fill="#E4ECFB" stroke="#3B6FD9" stroke-width="2"/><line x1="35" y1="80" x2="35" y2="15" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4,3"/><text x="8" y="50" font-size="10" fill="#FF6B6B">높이</text><text x="75" y="93" font-size="10" fill="#5B6B85" text-anchor="middle">밑변</text></svg>`;
const SVG_CIRCLE = `<svg viewBox="0 0 140 100" width="100%" height="90"><circle cx="70" cy="50" r="35" fill="#E4ECFB" stroke="#3B6FD9" stroke-width="2"/><line x1="70" y1="50" x2="105" y2="50" stroke="#FF6B6B" stroke-width="1.5"/><text x="80" y="44" font-size="10" fill="#FF6B6B">반지름</text></svg>`;

function setState(patch){ Object.assign(state, patch); render(); }

/* ---------------- persist settings across app launches (localStorage) ---------------- */
const LS_KEY = 'pooliq_settings_v1';
function loadSavedSettings(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(typeof saved.apiKey === 'string') state.apiKey = saved.apiKey;
    if(typeof saved.proxyUrl === 'string') state.proxyUrl = saved.proxyUrl;
    if(typeof saved.grade === 'string') state.grade = saved.grade;
    if(typeof saved.difficulty === 'string') state.difficulty = saved.difficulty;
    if(typeof saved.modelPref === 'string') state.modelPref = saved.modelPref;
  }catch(e){ console.warn('저장된 설정을 불러오지 못했어요:', e); }
}
function saveSettings(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      apiKey: state.apiKey,
      proxyUrl: state.proxyUrl,
      grade: state.grade,
      difficulty: state.difficulty,
      modelPref: state.modelPref,
    }));
  }catch(e){ console.warn('설정을 저장하지 못했어요:', e); }
}

function parseJSONLoose(text){
  let cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  try{ return JSON.parse(cleaned); }catch(e){}
  const s = cleaned.indexOf('{'), en = cleaned.lastIndexOf('}');
  if(s>=0 && en>s){
    try{ return JSON.parse(cleaned.slice(s, en+1)); }catch(e){}
  }
  throw new Error('AI 응답을 이해하지 못했어요');
}

function hasApiKey(){
  return !!(state.apiKey && state.apiKey.trim().length > 0);
}
function hasProxy(){
  return !!(state.proxyUrl && state.proxyUrl.trim().length > 0);
}
function hasAiAccess(){
  return hasProxy() || hasApiKey();
}

const GEMINI_MODEL = 'gemini-2.5-flash';

// Converts our existing Anthropic-style content blocks ([{type:'image',source:{...}}, {type:'text',text:'...'}])
// into Gemini's "parts" format, so none of the call sites below had to change.
function toGeminiParts(content){
  return content.map(block => {
    if(block.type === 'image'){
      return { inlineData: { mimeType: block.source.media_type, data: block.source.data } };
    }
    return { text: block.text };
  });
}

async function callAI(content){
  if(!hasAiAccess()){
    throw new Error('설정 화면에서 서버 주소 또는 Gemini API 키를 먼저 입력해주세요.');
  }

  // 우선순위: 백엔드 서버(proxyUrl)가 설정되어 있으면 그쪽을 먼저 써요 (API 키가 서버에만 있어서 더 안전해요).
  const useProxy = hasProxy();
  const payload = { contents: [{ role: 'user', parts: toGeminiParts(content) }] };
  const endpoint = useProxy
    ? state.proxyUrl.trim()
    : `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const headers = useProxy
    ? { "Content-Type": "application/json" }
    : { "Content-Type": "application/json", "x-goog-api-key": state.apiKey.trim() };

  let res;
  try{
    res = await fetch(endpoint, {
      method: "POST",
      headers,
      body: JSON.stringify(payload),
    });
  }catch(networkErr){
    const hint = useProxy ? '서버 주소가 올바른지 확인해주세요.' : '인터넷 연결을 확인하거나 API 키가 올바른지 확인해주세요.';
    throw new Error('네트워크 요청 자체가 실패했어요 (' + networkErr.message + '). ' + hint);
  }
  let data;
  try{ data = await res.json(); }
  catch(parseErr){ throw new Error('서버 응답을 읽지 못했어요 (status ' + res.status + ')'); }

  if(!res.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : ('요청이 실패했어요 (status ' + res.status + ')');
    throw new Error(msg);
  }
  const candidate = data && data.candidates && data.candidates[0];
  const text = candidate && candidate.content && candidate.content.parts
    ? candidate.content.parts.map(p => p.text || '').join('\n')
    : '';
  if(!text) throw new Error('AI 응답 형식이 예상과 달라요 (혹시 안전 필터에 걸렸을 수도 있어요)');
  return text;
}

function speakText(text){
  if(!('speechSynthesis' in window)){ alert('이 브라우저는 음성 읽기를 지원하지 않아요.'); return; }
  window.speechSynthesis.cancel();

  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}
function stopSpeaking(){

}

/* ---------------- tappable reading text ---------------- */
function renderTappableText(text){
  return text.split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok) || tok==='') return tok;
    const clean = tok.replace(/[.,!?;:"'’]/g,'').toLowerCase();
    return `<span class="word-tap" data-action="wordTap" data-value="${esc(clean)}">${esc(tok)}</span>`;
  }).join('');
}

/* ---------------- file handling ---------------- */
function handleFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const result = reader.result;
    const base64 = result.split(',')[1];
    setState({
      imageData: { base64, mediaType: file.type || 'image/jpeg', previewUrl: result },
      cropRect: { x: 5, y: 5, w: 90, h: 90 },
      screen: 'crop'
    });
  };
  reader.readAsDataURL(file);
}

function rotateImage(){
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalHeight;
    canvas.height = img.naturalWidth;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    const newUrl = canvas.toDataURL('image/jpeg', 0.92);
    setState({
      imageData: { ...state.imageData, mediaType: 'image/jpeg', base64: newUrl.split(',')[1], previewUrl: newUrl },
      cropRect: { x: 5, y: 5, w: 90, h: 90 }
    });
  };
  img.src = state.imageData.previewUrl;
}

function resetCropRect(){
  setState({ cropRect: { x: 5, y: 5, w: 90, h: 90 } });
}

function confirmCrop(){
  const img = new Image();
  img.onload = () => {
    const r = state.cropRect;
    const sx = img.naturalWidth * (r.x / 100);
    const sy = img.naturalHeight * (r.y / 100);
    const sw = img.naturalWidth * (r.w / 100);
    const sh = img.naturalHeight * (r.h / 100);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(sw));
    canvas.height = Math.max(1, Math.round(sh));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    const newUrl = canvas.toDataURL('image/jpeg', 0.92);
    state.imageData = { ...state.imageData, mediaType: 'image/jpeg', base64: newUrl.split(',')[1], previewUrl: newUrl };
    if(state.flowType === 'reading') recognizeReadingPassage();
    else recognizeProblem();
  };
  img.src = state.imageData.previewUrl;
}

/* ---- crop drag handling ---- */
let dragState = null;
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

function updateCropRectDom(){
  const el = document.getElementById('cropRect');
  if(!el) return;
  const r = state.cropRect;
  el.style.left = r.x + '%';
  el.style.top = r.y + '%';
  el.style.width = r.w + '%';
  el.style.height = r.h + '%';
}

document.addEventListener('pointerdown', (e) => {
  const stage = document.getElementById('cropStage');
  if(!stage) return;
  const handleEl = e.target.closest('.crop-handle');
  const rectEl = e.target.closest('.crop-rect');
  if(!handleEl && !rectEl) return;
  dragState = {
    type: handleEl ? 'resize' : 'move',
    handle: handleEl ? handleEl.dataset.handle : null,
    startX: e.clientX,
    startY: e.clientY,
    startRect: { ...state.cropRect },
    stageRect: stage.getBoundingClientRect(),
  };
  e.preventDefault();
});

document.addEventListener('pointermove', (e) => {
  if(!dragState) return;
  const { stageRect, startRect, type, handle } = dragState;
  const dxPct = (e.clientX - dragState.startX) / stageRect.width * 100;
  const dyPct = (e.clientY - dragState.startY) / stageRect.height * 100;
  let { x, y, w, h } = startRect;

  if(type === 'move'){
    x = clamp(startRect.x + dxPct, 0, 100 - startRect.w);
    y = clamp(startRect.y + dyPct, 0, 100 - startRect.h);
  } else {
    if(handle.includes('w')){
      const nx = clamp(startRect.x + dxPct, 0, startRect.x + startRect.w - 10);
      w = (startRect.x + startRect.w) - nx; x = nx;
    }
    if(handle.includes('e')){
      w = clamp(startRect.w + dxPct, 10, 100 - startRect.x);
    }
    if(handle.includes('n')){
      const ny = clamp(startRect.y + dyPct, 0, startRect.y + startRect.h - 10);
      h = (startRect.y + startRect.h) - ny; y = ny;
    }
    if(handle.includes('s')){
      h = clamp(startRect.h + dyPct, 10, 100 - startRect.y);
    }
  }
  state.cropRect = { x, y, w, h };
  updateCropRectDom();
});

document.addEventListener('pointerup', () => { dragState = null; });

            <div class="menu-txt"><strong style="font-size:13.5px;">${esc(t.topic)}</strong><span>${esc(t.summary)}</span></div>
            <div class="menu-chevron">›</div>
          </div>`).join('')}
      </div>
    </div>`).join('')}
  `;
}

function findGrammarTopic(id){
  for(const sec of GRAMMAR_SECTIONS){
    const found = sec.topics.find(t => t.id === id);
    if(found) return { ...found, section: sec.section };
  }
  return null;
}

function tplGrammarDetail(){
  const t = findGrammarTopic(state.grammarTopicId);
  if(!t) return `<p class="sub">문법 항목을 찾을 수 없어요.</p>`;
  return `
  <div class="card soft" style="margin-top:14px;">
    <div class="card-label">${esc(t.section)}</div>
    <p style="margin:0;font-family:var(--font-display);font-size:18px;color:var(--ink);">${esc(t.topic)}</p>
  </div>
  <div class="ref-unit">
    <h4>설명</h4>
    <p style="margin:0;font-size:14px;line-height:1.7;color:var(--ink);">${esc(t.explain)}</p>
  </div>
  <div class="ref-unit">
    <h4>예문</h4>
    <p style="margin:0;font-size:14px;line-height:1.7;color:var(--primary-dark);">${esc(t.example)}</p>
  </div>`;
}

function tplReadingResult(){
  const p = state.readingPassage;
  return `
  <div class="preview-wrap"><img src="${state.imageData.previewUrl}" alt="촬영한 지문"></div>
  <p class="sub" style="margin-top:0;">모르는 단어를 탭하면 AI가 뜻을 찾아줘요. 전체 듣기로 발음도 들어보세요.</p>
  <div class="passage-card">
    <h4>${esc(p.title)}</h4>
    <div class="passage-text">${renderTappableText(p.text)}</div>
  </div>
  ${state.wordLookupLoading ? `
    <div class="word-popup"><div class="wp-txt"><strong>찾는 중...</strong><span>몽당이가 사전을 뒤지고 있어요</span></div></div>` : ''}
  ${state.wordPopup ? `
    <div class="word-popup">
      <div class="wp-txt"><strong>${esc(state.wordPopup.word)}</strong><span>${esc(state.wordPopup.meaning)}</span></div>
      <button data-action="closeWordPopup">✕</button>
    </div>` : ''}
  <div class="btn-row">
    <button class="btn btn-primary" data-action="speakReadingPassage">🔊 전체 리딩</button>
    <button class="btn btn-outline" data-action="stopSpeak">정지</button>
  </div>
  <button class="btn btn-outline" style="margin-top:10px;" data-action="retakeReading">다른 지문 다시 찍기</button>`;

function tplConversation(){
  const dayIndex = Math.floor(Date.now() / 86400000) % CONVERSATION_SETS.length;
  const todaySet = CONVERSATION_SETS[dayIndex];
  return `
  ${mascotSVG(52)}
  <p class="sub" style="margin-top:0;">오늘의 회화 3문장이에요. 매일 자동으로 바뀌어요.</p>
  ${todaySet.map(c => `
    <div class="talk-card">
      <div class="tk-txt"><strong>${esc(c.en)}</strong><span>${esc(c.ko)}</span></div>
      <button class="talk-speak" data-action="speakOne" data-value="${esc(c.en)}">🔊</button>
    </div>`).join('')}
  `;
}

function tplCapture(){
  const isReading = state.flowType === 'reading';
  return `
  <p class="sub" style="margin-top:14px;">${isReading ? '읽고 싶은 영어 지문을 또렷하게 한 장 찍어주세요.' : SUBJECT_LABEL[state.subject] + ' 문제를 또렷하게 한 장 찍어주세요.'}</p>
  <div class="dropzone-row">
    <label class="dropzone dropzone-half">
      <div class="big-emoji">📷</div>
      <strong>사진 촬영</strong>
      <span>카메라 열기</span>
      <input type="file" accept="image/*" capture="environment" id="cameraInput" hidden>
    </label>
    <label class="dropzone dropzone-half">
      <div class="big-emoji">🖼️</div>
      <strong>갤러리에서 선택</strong>
      <span>저장된 사진 불러오기</span>

  </div>
  <div class="card">

    <p style="margin:0;font-size:13px;color:var(--ink-soft);line-height:1.6;">그림자 없이, ${isReading ? '지문' : '문제'} 전체가 화면 안에 들어오도록 찍으면 인식이 더 잘 돼요. 가로로 찍었거나 ${isReading ? '다른 지문이 함께' : '문제가 여러 개'} 보여도 다음 화면에서 자르고 돌릴 수 있어요.</p>

}

function tplCrop(){
  const r = state.cropRect;
  const isReading = state.flowType === 'reading';
  return `
  ${tplKeyWarning()}
  <p class="sub" style="margin-top:14px;">${isReading ? '원하는 지문 영역을' : '원하는 문제를'} 화면 영역(사각형)에 맞게 잘라주세요. 사진이 가로로 찍혔다면 회전 버튼을 눌러주세요.</p>
  <div class="crop-stage" id="cropStage">
    <img src="${state.imageData.previewUrl}" alt="자를 사진">
    <div class="crop-hint">모서리를 끌어 크기 조절 · 안쪽을 끌어 이동</div>
    <div class="crop-rect" id="cropRect" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;">
      <div class="crop-handle nw" data-handle="nw"></div>
      <div class="crop-handle ne" data-handle="ne"></div>
      <div class="crop-handle sw" data-handle="sw"></div>

  </div>
  <button class="btn btn-primary" style="margin-top:10px;" data-action="confirmCrop">이 영역으로 ${isReading ? '지문' : '문제'} 인식하기</button>
  <button class="btn btn-outline" style="margin-top:10px;" data-action="retake">다시 찍을게요</button>`;

function tplConfirm(){

  const multiNotice = (r.multiple_detected === true || r.multiple_detected === 'true')
    ? `<div class="concept-box"><span class="ic">🔍</span><p>사진에 문제가 여러 개 보여서 가장 크게 보이는 문제 하나만 골라 읽었어요. 다른 문제였다면 직접 내용을 고치거나 다시 찍어주세요.</p></div>`
    : '';
  return `
  <div class="preview-wrap"><img src="${state.imageData.previewUrl}" alt="촬영한 문제"></div>
  ${multiNotice}
  <div class="card">
    <div class="card-label">몽당이가 읽은 문제 · ${esc(r.problem_type||'')}</div>
    <textarea class="recog" id="recogText">${esc(r.problem_text)}</textarea>
  </div>
  <p class="sub" style="margin-top:0;">내용이 맞는지 확인해주세요. 다르면 직접 고쳐도 돼요.</p>
  <button class="btn btn-primary" data-action="confirmProblem">맞아요, 이 문제예요</button>
  <button class="btn btn-outline" style="margin-top:10px;" data-action="retake">다르게 인식됐어요 · 다시 찍기</button>`;
}

function tplSolution(){
  const s = state.solution;
  return `
  <div class="card" style="background:var(--bg);border:none;">
    <div class="card-label">원본 문제</div>
    <p class="problem-text" style="font-size:13.5px;color:var(--ink-soft);">${esc(state.recognized.problem_text)}</p>
  </div>
  <div class="concept-box"><span class="ic">💡</span><p><strong>핵심 개념</strong> · ${esc(s.concept_summary)}</p></div>
  ${s.steps.map((st,i)=>`
    <div class="step-card">
      <div class="step-head"><span class="step-num">${i+1}</span><span class="step-title">${esc(st.title)}</span></div>
      <div class="step-body">${esc(st.explanation)}</div>
    </div>`).join('')}
  <div class="answer-box"><div class="lbl">최종 정답</div><div class="val">${esc(s.final_answer)}</div></div>
  <button class="btn btn-primary" data-action="goSimilar">비슷한 문제 풀어보기 →</button>
  <button class="btn btn-ghost" style="margin-top:10px;" data-action="explainEasier">이해가 안 돼요 · 더 쉽게 설명해줘</button>`;
}

function tplSimilar(){
  const sim = state.similar;
  const result = state.answerResult;
  return `
  <div class="card soft">
    <div class="card-label">비슷한 유형으로 한 번 더!</div>
    <p class="problem-text">${esc(sim.problem)}</p>
  </div>
  <input class="answer-input" id="answerInput" placeholder="답을 입력해보세요" value="${esc(state.userAnswer)}" ${result?'disabled':''}>
  ${!result ? `
    <button class="btn btn-primary" data-action="submitAnswer">채점하기</button>
    <button class="btn btn-outline" style="margin-top:10px;" data-action="showHint">힌트 보기</button>
  ` : `
    <div class="feedback ${result}">
      <div class="ft-title">${result==='correct' ? '정답이에요! 🎉' : '아직 조금 아쉬워요'}</div>
      <div class="ft-body">${result==='correct' ? '완벽하게 이해했네요. 다음 문제로 넘어가볼까요?' : `정답은 <strong>${esc(sim.answer)}</strong> 이에요. 풀이를 다시 볼까요?`}</div>
    </div>
    ${result==='correct' ? `
      <button class="btn btn-primary" data-action="home">홈으로 돌아가기</button>
    ` : `
      <div class="btn-row">
        <button class="btn btn-outline" data-action="backToSolution">풀이 다시 보기</button>
        <button class="btn btn-warn" data-action="saveMistake">오답노트에 저장</button>
      </div>
    `}
  `}
  <p class="sub" style="margin-top:16px;font-size:12px;">* 프로토타입에서는 답을 간단한 문자열 비교로 채점해요. 실제 서비스에서는 AI가 더 유연하게 채점할 수 있어요.</p>`;
}

function tplMistakes(){
  if(!state.mistakes.length){
    return `<div class="empty-state">${mascotSVG(56)}<strong>아직 저장된 오답이 없어요</strong><span>문제를 풀다가 틀리면 여기에 자동으로 모일 거예요</span></div>`;
  }
  const groups = {};
  state.mistakes.forEach((m,i)=>{
    const key = m.problem_type || '기타';
    groups[key] = groups[key] || [];
    groups[key].push(i);
  });
  return `
  <p class="sub" style="margin-top:14px;">유형별로 모아놨어요. 탭하면 풀이를 다시 볼 수 있어요.</p>
  ${Object.entries(groups).map(([type, idxs])=>`
    <div class="mistake-item" data-action="toggleMistake" data-value="${idxs[0]}">
      <div class="mtop"><span class="mtype">${esc(type)}</span><span class="mcount">${idxs.length}회</span></div>
      <div class="msnippet">${esc((state.mistakes[idxs[0]].problem_text||'').slice(0,40))}...</div>
      ${state.expandedMistake===idxs[0] ? `
        <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
          <div class="concept-box"><span class="ic">💡</span><p>${esc(state.mistakes[idxs[0]].solution.concept_summary)}</p></div>
          ${state.mistakes[idxs[0]].solution.steps.map((st,i)=>`
            <div class="step-card" style="margin-bottom:8px;">
              <div class="step-head"><span class="step-num">${i+1}</span><span class="step-title">${esc(st.title)}</span></div>
              <div class="step-body">${esc(st.explanation)}</div>
            </div>`).join('')}
        </div>` : ''}
    </div>`).join('')}
  `;
}

function tplSettings(){
  return `
  <div class="settings-block">
    <h3>백엔드 서버 주소 (권장) ${hasProxy() ? '✅' : ''}</h3>
    <input type="text" class="model-select" id="proxyUrlInput" placeholder="https://your-worker.your-name.workers.dev" value="${esc(state.proxyUrl)}" style="margin-bottom:0;">
    <div class="model-note">
      직접 만든 서버(예: Cloudflare Worker) 주소를 입력하면, API 키를 서버에만 안전하게 보관하고 이 앱은 그 서버로만 요청을 보내요. 이 칸이 채워져 있으면 아래 API 키는 사용되지 않아요.
    </div>
  </div>
  <div class="settings-block">
    <h3>Gemini API 키 (서버 없이 테스트용) ${hasApiKey() ? '✅' : ''}</h3>
    <input type="password" class="model-select" id="apiKeyInput" placeholder="AIza..." value="${esc(state.apiKey)}" style="margin-bottom:0;">
    <div class="model-note">
      백엔드 서버 주소를 아직 안 만들었다면, 임시로 이 키를 브라우저에서 직접 사용할 수 있어요.
      <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--primary);">aistudio.google.com/apikey</a>에서 구글 계정으로 로그인해 무료로 발급받아 붙여넣어주세요 (신용카드 필요 없어요).
      입력한 키는 이 브라우저 탭에만 잠시 저장되고, Google 서버로만 직접 전송돼요. 새로고침하면 다시 입력해야 해요.
    </div>
  </div>
  <div class="settings-block">
    <h3>학년</h3>
    <div class="grade-row">
      ${Object.entries(GRADE_LABEL).map(([k,v])=>`<button class="chip ${state.grade===k?'active':''}" data-action="setGrade" data-value="${k}">${v}</button>`).join('')}
    </div>
  </div>
  <div class="settings-block">
    <h3>설명 난이도 기본값</h3>
    <div class="grade-row">
      <button class="chip ${state.difficulty==='normal'?'active':''}" data-action="setDifficulty" data-value="normal">표준 설명</button>
      <button class="chip ${state.difficulty==='easy'?'active':''}" data-action="setDifficulty" data-value="easy">쉬운 설명</button>
    </div>
  </div>
  <div class="settings-block">
    <h3>AI 모델 선택</h3>
    <select class="model-select" id="modelSelect">
      ${Object.entries(MODEL_LABEL).map(([k,v])=>`<option value="${k}" ${state.modelPref===k?'selected':''}>${v}</option>`).join('')}
    </select>
    <div class="model-note">현재 프로토타입은 Gemini Flash 모델로 동작해요. 실제 서비스에서는 여기서 고른 모델로 풀이 요청이 연결될 예정이에요.</div>
  </div>
  <div class="settings-block">
    <h3>데이터</h3>
    <button class="btn btn-outline" data-action="resetAll">오답노트 초기화</button>
  </div>
  `;
}

function tplError(){
  if(!state.error) return '';
  return `<div class="error-box"><strong>앗, 문제가 생겼어요</strong><span>${esc(state.error)}</span></div>`;
}

function tplLoading(){
  if(!state.loading) return '';
  return `<div class="loading-overlay">${mascotSVG(70)}<div class="spinner"></div><p>${esc(state.loadingMsg)}</p></div>`;
}

/* ---------------- render ---------------- */
function render(){
  const screens = {
    home: tplHome, capture: tplCapture, crop: tplCrop, confirm: tplConfirm, solution: tplSolution,
    similar: tplSimilar, mistakes: tplMistakes, settings: tplSettings,
    mathHub: tplMathHub, englishHub: tplEnglishHub, mathFormulas: tplMathFormulas,
    grammarRef: tplGrammarRef, grammarDetail: tplGrammarDetail, readingResult: tplReadingResult, conversation: tplConversation,
  };
  document.getElementById('root').innerHTML = `
    ${tplTopbar()}
    <div class="content">${tplError()}${screens[state.screen]()}</div>
    ${tplBottomNav()}
    ${tplLoading()}
  `;
}

/* ---------------- events (delegated) ---------------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const value = t.dataset.value;

  if(action==='nav') setState({ screen: t.dataset.target, wordPopup:null });
  else if(action==='setGrade'){ setState({ grade: value }); saveSettings(); }
  else if(action==='setDifficulty'){ setState({ difficulty: value }); saveSettings(); }
  else if(action==='openHub'){ setState({ subject: value, screen: value==='math' ? 'mathHub' : 'englishHub' }); }
  else if(action==='goSubjectCapture'){ setState({ subject: value, flowType:'solve', imageData:null, cropRect:{x:5,y:5,w:90,h:90}, screen:'capture', error:null }); }
  else if(action==='goReadingCapture'){ setState({ subject:'english', flowType:'reading', imageData:null, readingPassage:null, wordPopup:null, cropRect:{x:5,y:5,w:90,h:90}, screen:'capture', error:null }); }
  else if(action==='openGrammarTopic') setState({ screen:'grammarDetail', grammarTopicId: value });
  else if(action==='wordTap') lookupWordAI(value);
  else if(action==='closeWordPopup') setState({ wordPopup: null });
  else if(action==='speakReadingPassage') speakText(state.readingPassage.text);
  else if(action==='retakeReading') setState({ imageData:null, readingPassage:null, wordPopup:null, cropRect:{x:5,y:5,w:90,h:90}, screen:'capture', error:null });
  else if(action==='speakOne') speakText(value);
  else if(action==='stopSpeak') stopSpeaking();
  else if(action==='close') closeAction();
  else if(action==='home') goHome();
  else if(action==='retake') setState({ imageData: null, cropRect:{x:5,y:5,w:90,h:90}, screen: 'capture', error:null });
  else if(action==='rotateImage') rotateImage();
  else if(action==='resetCropRect') resetCropRect();
  else if(action==='confirmCrop') confirmCrop();
  else if(action==='confirmProblem'){
    const ta = document.getElementById('recogText');
    state.recognized.problem_text = ta ? ta.value : state.recognized.problem_text;
    solveProblem('normal');
  }
  else if(action==='goSimilar') generateSimilar();
  else if(action==='explainEasier') solveProblem('easy');
  else if(action==='submitAnswer'){
    const inp = document.getElementById('answerInput');
    state.userAnswer = inp ? inp.value : '';
    checkAnswer();
  }
  else if(action==='showHint') alert('힌트: ' + (state.similar.hint || '천천히 원본 풀이를 다시 떠올려보세요.'));
  else if(action==='backToSolution') setState({ screen:'solution', answerResult:null });
  else if(action==='saveMistake') saveToMistakes();
  else if(action==='toggleMistake'){
    const idx = Number(value);
    setState({ expandedMistake: state.expandedMistake===idx ? null : idx });
  }
  else if(action==='resetAll') setState({ mistakes: [], expandedMistake:null });
});

document.addEventListener('change', (e) => {
  if(e.target.id === 'cameraInput' || e.target.id === 'galleryInput'){
    handleFile(e.target.files[0]);
  }
  if(e.target.id === 'modelSelect'){
    setState({ modelPref: e.target.value });
    saveSettings();
  }
  if(e.target.id === 'apiKeyInput'){
    setState({ apiKey: e.target.value });
    saveSettings();
  }
  if(e.target.id === 'proxyUrlInput'){
    setState({ proxyUrl: e.target.value });
    saveSettings();
  }
});

/* ---------------- init ---------------- */
loadSavedSettings();
render();

/* ---------------- PWA: register service worker ---------------- */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
